<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="速記">
<meta name="theme-color" content="#C4A882">
<title>速記 · 待辦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #F5F0E8;
    --bg2:       #EDE8DE;
    --surface:   #FDFAF5;
    --rose:      #C4927A;
    --rose-lt:   #DDB99F;
    --sage:      #8FA89A;
    --sage-lt:   #B8CCC4;
    --slate:     #8E9BB0;
    --slate-lt:  #B8C4D4;
    --warm:      #C4A882;
    --warm-lt:   #D9C9AE;
    --text:      #3D3530;
    --text2:     #7A6E68;
    --text3:     #A89F98;
    --done-bg:   #EAE6E0;
    --radius:    16px;
    --shadow:    0 2px 16px rgba(61,53,48,.08);
    --shadow2:   0 4px 24px rgba(61,53,48,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    padding: 20px 24px 16px;
    box-shadow: 0 1px 0 rgba(61,53,48,.06);
  }
  .header-row {
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .app-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 600;
    color: var(--rose);
    letter-spacing: .02em;
    line-height: 1;
  }
  .app-sub {
    font-size: 11px; color: var(--text3);
    letter-spacing: .08em; text-transform: uppercase;
    margin-top: 4px;
  }
  .date-badge {
    font-size: 12px; color: var(--text2);
    background: var(--bg2);
    padding: 5px 12px; border-radius: 20px;
    letter-spacing: .04em;
  }

  .tabs {
    display: flex; gap: 4px;
    padding: 12px 24px 0;
    background: var(--surface);
  }
  .tab {
    flex: 1; padding: 8px 0;
    font-size: 13px; font-weight: 500;
    color: var(--text3);
    border: none; background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    letter-spacing: .04em;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .tab.active { color: var(--rose); border-bottom-color: var(--rose); }

  .content { padding: 20px 20px 140px; }

  .section-label {
    font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text3);
    margin: 8px 4px 12px;
  }

  .todo-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s, opacity .3s;
    animation: slideIn .25s ease;
    position: relative;
    overflow: hidden;
  }
  .todo-item::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--rose-lt);
    transition: background .2s;
  }
  .todo-item:nth-child(3n+1)::before { background: var(--rose-lt); }
  .todo-item:nth-child(3n+2)::before { background: var(--sage-lt); }
  .todo-item:nth-child(3n)::before   { background: var(--slate-lt); }

  .todo-item.completing {
    animation: completeOut .35s ease forwards;
  }

  .check-wrap {
    flex-shrink: 0;
    width: 22px; height: 22px; margin-top: 1px;
    position: relative; cursor: pointer;
  }
  .check-wrap input { position: absolute; opacity: 0; width: 0; height: 0; }
  .checkmark {
    width: 22px; height: 22px;
    border: 2px solid var(--warm-lt);
    border-radius: 6px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .check-wrap input:checked ~ .checkmark {
    background: var(--rose);
    border-color: var(--rose);
  }
  .checkmark svg { opacity: 0; transform: scale(.5); transition: all .2s; }
  .check-wrap input:checked ~ .checkmark svg { opacity: 1; transform: scale(1); }

  .todo-text {
    flex: 1;
    font-size: 15px; line-height: 1.55;
    color: var(--text);
    word-break: break-word;
  }
  .todo-time {
    font-size: 11px; color: var(--text3);
    margin-top: 4px;
  }

  .del-btn {
    flex-shrink: 0;
    background: none; border: none;
    color: var(--text3); cursor: pointer;
    padding: 2px; opacity: 0;
    transition: opacity .2s;
  }
  .todo-item:hover .del-btn, .todo-item:focus-within .del-btn { opacity: 1; }

  .done-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--done-bg);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 8px;
    animation: slideIn .25s ease;
    opacity: .75;
  }
  .done-check {
    width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
    background: var(--sage);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .done-text {
    flex: 1; font-size: 14px; color: var(--text2);
    text-decoration: line-through;
    text-decoration-color: var(--text3);
    word-break: break-word;
  }
  .done-time { font-size: 10px; color: var(--text3); margin-top: 3px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
  }
  .empty-icon { font-size: 44px; margin-bottom: 16px; filter: saturate(.6); }
  .empty-text { font-size: 14px; color: var(--text3); line-height: 1.7; }

  .input-area {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -1px 0 rgba(61,53,48,.06), 0 -8px 32px rgba(61,53,48,.06);
  }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
  }
  .text-input {
    flex: 1;
    background: var(--bg2);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 11px 16px;
    font-size: 15px; font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    resize: none; height: 46px; max-height: 120px;
    outline: none; transition: border-color .2s, background .2s;
    overflow-y: hidden;
  }
  .text-input:focus {
    border-color: var(--rose-lt);
    background: var(--surface);
  }
  .text-input::placeholder { color: var(--text3); }

  .icon-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    border: none; border-radius: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    font-size: 20px;
  }
  .add-btn {
    background: var(--rose);
    color: #fff;
    box-shadow: 0 3px 12px rgba(196,146,122,.4);
  }
  .add-btn:active { transform: scale(.93); }

  .mic-btn {
    background: var(--warm-lt);
    color: var(--text);
  }
  .mic-btn.listening {
    background: var(--rose);
    color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .mic-btn:active { transform: scale(.93); }

  .listening-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 4px;
    font-size: 12px; color: var(--rose);
    letter-spacing: .04em;
    height: 0; overflow: hidden; opacity: 0;
    transition: all .25s;
  }
  .listening-bar.show { height: 32px; opacity: 1; }
  .wave {
    display: flex; align-items: center; gap: 2px;
  }
  .wave span {
    display: inline-block;
    width: 3px; height: 8px;
    background: var(--rose);
    border-radius: 2px;
    animation: wave 0.9s ease-in-out infinite;
  }
  .wave span:nth-child(2) { animation-delay: .15s; height: 14px; }
  .wave span:nth-child(3) { animation-delay: .3s;  height: 18px; }
  .wave span:nth-child(4) { animation-delay: .45s; height: 14px; }
  .wave span:nth-child(5) { animation-delay: .6s;  height: 8px; }

  .clear-btn {
    width: 100%; padding: 10px;
    background: none; border: 1.5px dashed var(--warm-lt);
    border-radius: var(--radius);
    font-size: 13px; color: var(--text2);
    cursor: pointer; margin-top: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all .2s;
  }
  .clear-btn:hover { background: var(--bg2); }

  .toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: #fff;
    padding: 9px 20px; border-radius: 20px;
    font-size: 13px; letter-spacing: .04em;
    opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes completeOut {
    0%   { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(60px); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(196,146,122,.4); }
    50%       { box-shadow: 0 0 0 8px rgba(196,146,122,.0); }
  }
  @keyframes wave {
    0%, 100% { transform: scaleY(1); }
    50%       { transform: scaleY(1.8); }
  }

  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <div class="app-title">速記</div>
      <div class="app-sub">Quick Todo</div>
    </div>
    <div class="date-badge" id="dateBadge"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('todo',this)">待辦</button>
  <button class="tab" onclick="switchTab('done',this)">已完成</button>
</div>

<div class="content panel active" id="todoPanel">
  <div class="section-label" id="todoCount"></div>
  <div id="todoList"></div>
</div>

<div class="content panel" id="donePanel">
  <div class="section-label" id="doneCount"></div>
  <div id="doneList"></div>
</div>

<div class="input-area">
  <div class="listening-bar" id="listeningBar">
    <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    <span id="listeningText">聆聽中…</span>
  </d
